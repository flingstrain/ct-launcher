[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ct-launcher"
version = "0.2.0"
description = "Index, search and open local Cheat Engine table (.CT) collections. No dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["cheat-engine", "cheat-tables", "cli", "gaming", "single-player"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://flingstrain.github.io/"
Source = "https://github.com/flingstrain/ct-launcher"
Issues = "https://github.com/flingstrain/ct-launcher/issues"

[project.scripts]
ct-launcher = "ct_launcher:main"

[tool.setuptools]
py-modules = ["ct_launcher"]
